name: Honest Food Company
description: 'Honest Food Company GmbH is a Berlin-based cloud-kitchen / ghost-restaurant operator founded
  in 2017 that produced and delivered food under a portfolio of virtual delivery-only brands (Mamacita,
  Blattgold, Baba Noni, Beste Freunde, Holy Chicken, Clubkitchen) ordered through its own sites and third-party
  delivery platforms. Backed by Creandum and Index Ventures, it was acquired by Delivery Hero SE in February
  2020 and folded into the Delivery Hero group; it operates no independent public developer/API surface.
  Added to the API Evangelist network as a Creandum portfolio lead. Sector: consumer / food delivery.'
